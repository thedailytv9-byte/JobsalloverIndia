    <script>
        // --- 1. LANGUAGE SWITCHER FUNCTIONALITY ---
        function toggleLang(lang) {
            // Remove lang classes and add the selected one to the body
            document.body.classList.remove('lang-en', 'lang-pa');
            document.body.classList.add('lang-' + lang);

            // Update active states on switcher buttons
            document.getElementById('btn-pa').classList.remove('active');
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-' + lang).classList.add('active');
            
            // Optional: Save preference for return visits
            localStorage.setItem('preferredLang', lang);
        }

        // Load saved language or default to Punjabi on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferredLang') || 'pa';
            toggleLang(savedLang);
            
            // Check if user is logged in as admin to show/hide panel
            checkAdminStatus();
        });


        // --- 2. ADMIN PANEL ACCESS CONTROL ---
        function checkAdminStatus() {
            const isAdmin = localStorage.getItem('isAdminLoggedIn') === 'true';
            const adminPanel = document.querySelector('.admin-section');
            
            if (adminPanel) {
                // Completely hide the element from the layout if not admin
                if (isAdmin) {
                    adminPanel.style.display = 'block';
                } else {
                    adminPanel.style.display = 'none';
                }
            }
        }

        function adminLogin() {
            // Simple prototype password check (Replace with secure authentication later)
            const password = prompt("Enter Admin Password:");
            if (password === "admin123") { 
                alert("Login Successful!");
                localStorage.setItem('isAdminLoggedIn', 'true');
                checkAdminStatus();
            } else {
                alert("Incorrect password access denied.");
            }
        }
        
        // Call this from your browser console to log out: localStorage.removeItem('isAdminLoggedIn'); checkAdminStatus();
    </script>
</body>
</html>
