<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>ਰੁਜ਼ਗਾਰ ਪੰਜਾਬ | Rozgar Punjab</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">
    <nav class="bg-indigo-700 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">ਰੁਜ਼ਗਾਰ ਪੰਜਾਬ | Rozgar Punjab</h1>
    </nav>

    <main class="max-w-4xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <aside class="md:col-span-1">
            <section class="bg-white p-4 rounded shadow">
                <h2 class="font-bold mb-2">Contact / ਸੰਪਰਕ</h2>
                <a href="mailto:support@naukriconnect.in" class="text-indigo-600 underline">support@naukriconnect.in</a>
            </section>
        </aside>

        <section class="md:col-span-2">
            <h2 class="text-2xl font-bold mb-4">Latest Jobs / ਤਾਜ਼ਾ ਨੌਕਰੀਆਂ</h2>
            <div id="jobList" class="space-y-4">
                </div>
        </section>
    </main>

    <script>
        // ADD JOBS HERE: Only you can edit this list
        const jobs = [
            { title: "Security Guard (ਸੁਰੱਖਿਆ ਗਾਰਡ)", company: "G4S Punjab", link: "https://in.indeed.com/" },
            { title: "Telecaller (ਟੈਲੀਕਾਲਰ)", company: "Mohali BPO", link: "https://in.indeed.com/" }
        ];

        const container = document.getElementById('jobList');
        jobs.forEach(job => {
            container.innerHTML += `
                <div class="bg-white p-4 rounded shadow border-l-4 border-indigo-600">
                    <h3 class="font-bold">${job.title}</h3>
                    <p class="text-sm text-gray-600">${job.company}</p>
                    <a href="${job.link}" target="_blank" class="text-indigo-600 font-semibold">Apply / ਅਪਲਾਈ ਕਰੋ</a>
                </div>`;
        });
    </script>
</body>
</html>
