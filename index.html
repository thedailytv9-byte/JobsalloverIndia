<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaukriConnect | Latest Jobs in India</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold tracking-tight">Naukri<span class="text-indigo-200">Connect</span></a>
            <div class="space-x-4">
                <a href="#jobs-section" class="hover:text-indigo-200 transition">Find Jobs</a>
            </div>
        </div>
    </nav>

    <header class="bg-indigo-900 text-white py-16 px-4 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Discover Your Next Career Move in India</h1>
        <p class="text-xl text-indigo-200 max-w-2xl mx-auto">Connecting India's brightest talent with top-tier companies.</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <aside class="lg:col-span-1 space-y-8">
            <section class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Important Links</h2>
                <ul class="space-y-3 text-indigo-600">
                    <li><a href="#" class="hover:underline">About Us</a></li>
                    <li><a href="#" class="hover:underline">Privacy Policy</a></li>
                    <li><a href="#" class="hover:underline">Terms of Service</a></li>
                </ul>
            </section>
            <section class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Contact</h2>
                <p class="text-gray-600 text-sm mb-2">For inquiries, reach out to us at:</p>
                <a href="mailto:support@naukriconnect.in" class="text-indigo-600 font-bold hover:underline">support@naukriconnect.in</a>
            </section>
        </aside>

        <section id="jobs-section" class="lg:col-span-2 space-y-6">
            <div class="bg-white p-4 rounded-lg shadow-md flex gap-4 items-center">
                <input type="text" id="searchInput" placeholder="Search jobs..." class="w-full p-2 border rounded-md">
            </div>
            <div id="listingsContainer" class="space-y-4"></div>
        </section>
    </main>

    <script>
        const jobs = [
            { title: "Frontend Engineer", company: "Razorpay", location: "Bengaluru", salary: "14-22 LPA" },
            { title: "Data Analyst", company: "TCS", location: "Mumbai", salary: "5-8 LPA" }
        ];
        const container = document.getElementById('listingsContainer');
        jobs.forEach(job => {
            container.innerHTML += `<div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-indigo-600">
                <h3 class="text-xl font-bold">${job.title}</h3>
                <p>${job.company} • ${job.location}</p>
                <p class="text-green-700 font-semibold">${job.salary}</p>
            </div>`;
        });
    </script>
</body>
</html>
